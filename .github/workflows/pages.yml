name: Collect and deploy Campo e Clima
on:
  workflow_dispatch:
  schedule:
    # GitHub cron works in UTC. Run every half-hour; scheduling may be delayed.
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'data/observacoes/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Front-end update smoke test (offline)
        run: node tests/frontend_smoke.cjs
      - name: Rain trace and dry-scenario regression (offline)
        run: node tests/test_rain_scenarios_v16.cjs
      - name: Forward 72h and operational classification regression (offline)
        run: node tests/test_forward_browser_v18.cjs
      - name: INMET groups and radar controls regression (offline)
        run: node tests/test_ux_v19.cjs
      - name: Radar playback, UTC/local time and quantitative legend regression (offline)
        run: node tests/test_maps_controls_v20.cjs
      - name: Central Agro decision rules and recent-history regression (offline)
        run: node tests/test_agro_cockpit_v21.cjs
      # NASA POWER and ECMWF extended series update at most once per local day.
      # The cache is shared between scheduled runs, avoiding 48 identical daily requests.
      - name: Set local day for slow-source cache
        run: echo "SLOW_DAY=$(TZ=America/Campo_Grande date +%F)" >> "$GITHUB_ENV"
      - name: Restore/cache slow source products
        uses: actions/cache@v4
        with:
          path: site/data/slow_sources_cache.json
          key: slow-sources-v13-${{ env.SLOW_DAY }}
      # Seasonal product is checked only once per ISO week, not on every visit.
      - name: Set ISO week for seasonal cache
        run: echo "SLOW_WEEK=$(TZ=America/Campo_Grande date +%G-W%V)" >> "$GITHUB_ENV"
      - name: Restore/cache weekly ECMWF product
        uses: actions/cache@v4
        with:
          path: site/data/weekly_sources_cache.json
          key: seasonal-v13-${{ env.SLOW_WEEK }}
      - name: Set climatology cache month
        run: echo "CLIMATE_MONTH=$(TZ=America/Campo_Grande date +%Y-%m)" >> "$GITHUB_ENV"
      - name: Restore/cache 1991–2020 climate baseline (monthly)
        uses: actions/cache@v4
        with:
          path: site/data/climate_cache.json
          key: climate-era5-land-v08-${{ env.CLIMATE_MONTH }}
      - name: Collect forecasts
        env:
          NASA_POWER_ENABLE: '1'
          ECMWF_EXTENDED_ENABLE: '1' # Consultar UMA vez por semana via cache separado.
          GEFS_EXTENDED_ENABLE: '1' # Uma vez por dia: GEFS 15–35 dias, um único ensemble.
          CLIMATE_ERA5_ENABLE: '0' # Pausada até validar a completude dos 30 anos em grade.
          # Optional NEW secret, used exclusively by free /data/2.5/forecast API.
          OPENWEATHER_FREE_API_KEY: ${{ secrets.OPENWEATHER_FREE_API_KEY }}
        run: python scripts/collect.py
      # Temporary audit snapshots for future forecast verification; NOT permanent storage.
      # GitHub artifact retention is limited. Move to durable object storage later.
      - name: Export free INMET station metadata for arbitrary farm coordinates
        run: python scripts/export_inmet_catalog.py
      - name: Restore daily observed-vs-gridded historical archive (Naviraí)
        uses: actions/cache@v4
        with:
          path: site/data/history_daily_cache.json
          key: history-navirai-v19-${{ env.SLOW_DAY }}
          restore-keys: |
            history-navirai-v19-
      - name: Refresh Naviraí gridded history (NASA POWER and ERA5)
        continue-on-error: true
        run: python -m scripts.collect_history_v19
      - name: Archive collected forecast snapshot (up to 90 days)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: forecast-${{ github.run_id }}
          path: site/data/latest.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
