name: Offline integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pip install -r requirements-science.txt
      - name: Python scientific and operational tests without external HTTP
        env:
          CAMPO_OFFLINE_TESTS: '1'
          AI_PROVIDER: none
          AI_ENABLE: '0'
        run: python -m pytest -q
      - name: All offline JavaScript suites
        run: |
          for test in tests/frontend_smoke.cjs tests/test_*.cjs; do node "$test"; done
          for source in site/static/*.js; do node --check "$source"; done
