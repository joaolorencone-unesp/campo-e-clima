name: Scientific history and experimental verification
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
permissions:
  contents: read
concurrency:
  group: weather-archive-writer
  cancel-in-progress: false
  queue: max
jobs:
  science:
    if: github.repository == 'joaolorencone-unesp/campo-e-clima' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 40 # daily history + station verification (~150 cached Previous Runs requests) + archive
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements-science.txt
      - name: Offline scientific regression
        run: python -m pytest -q tests/test_science_v22.py
      - name: Daily fixed-lead deterministic history (bounded seven days)
        env:
          INMET_API_TOKEN: ${{ secrets.INMET_API_TOKEN }}
        run: python -m scripts.science_daily
      - name: Restore station forecast cache (Previous Runs, 30-day TTL)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/http_cache
          key: station-previous-runs-v40-${{ hashFiles('data/stations/stations.json') }}-${{ github.run_id }}
          restore-keys: |
            station-previous-runs-v40-${{ hashFiles('data/stations/stations.json') }}-
            station-previous-runs-v40-
      # Physical stations: observations supplied in data/stations, forecasts fetched at the station
      # coordinates, corrections validated out of sample. Failures never block the archive.
      - name: Station verification and bias correction (free Previous Runs API)
        continue-on-error: true
        env:
          STATION_MODELS: ${{ vars.STATION_MODELS }}
        run: python -m scripts.station_calibration --fetch --output-dir runtime/stations_public
      - name: Preserve recovery transport before attempting Git publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: science-history-${{ github.run_id }}
          path: runtime/imports
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve history and evaluate; weekly shadow experiments only
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: none
          AI_ENABLE: '0'
          AI_ALLOW_PAID: '0'
        run: |
          EXTRA=""
          if [ "$(date -u +%u)" = "1" ]; then EXTRA="--train"; fi
          STATION_REPORTS_DIR=runtime/stations_public python -m scripts.archive_git --captures runtime/imports --push $EXTRA
      - name: Diagnostic log (temporary transport, not permanent archive)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-status-${{ github.run_id }}
          path: runtime/daily_status.json
          retention-days: 7
